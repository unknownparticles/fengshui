name: 正式发布页面
on:
  workflow_dispatch:
    inputs:
      allow_pending_manual_checks:
        description: '发布已通过自动验证的手录版本，保留手机实机验收待完成状态'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:release
        if: ${{ !inputs.allow_pending_manual_checks }}
      - name: 记录手录版本发布范围
        if: ${{ inputs.allow_pending_manual_checks }}
        run: echo '按用户授权发布已验证的手录版本；手机传感器正式锁定保持未启用，实机记录保持待完成。'
      - run: npm run check:spec
      - run: npm test
      - run: npm run build
        env:
          DEPLOY_BASE_PATH: /fengshui/
          BUILD_REVISION: ${{ github.sha }}
      - run: npm run check:paths
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:root
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
